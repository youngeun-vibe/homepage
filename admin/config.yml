# =========================================================
# 관리자 페이지(Sveltia CMS) 설정
# - 홈페이지 주소/admin 에서 접속합니다.
# - 저장하면 GitHub 저장소(main 브랜치)에 반영되고, 1~2분 뒤 홈페이지에 나타납니다.
# =========================================================
backend:
  name: github
  repo: youngeun-vibe/homepage
  branch: main
  # 'GitHub로 로그인' 버튼을 쓰려면 Sveltia CMS Authenticator(무료) 설치 후 주소를 넣으세요.
  # base_url: https://sveltia-cms-auth.<계정>.workers.dev
  commit_messages:
    create: "{{collection}} 추가: {{slug}}"
    update: "{{collection}} 수정: {{slug}}"
    delete: "{{collection}} 삭제: {{slug}}"
    uploadMedia: "파일 업로드: {{path}}"
    deleteMedia: "파일 삭제: {{path}}"

# 업로드한 사진·파일 저장 위치
media_folder: assets/uploads
public_folder: assets/uploads

collections:
  # ---------------------------------------------------------
  - name: news
    label: 소식
    label_singular: 소식
    description: 공지사항, 행사·교육, 지원사업, 언론보도 글을 올립니다. 날짜가 최신인 글이 위에 보입니다.
    file: content/news.json
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: id, label: 글 번호, widget: compute, value: "{{uuid_short}}" }
      - { name: title, label: 제목, widget: string }
      - name: category
        label: 분류
        widget: select
        default: notice
        options:
          - { label: 공지사항, value: notice }
          - { label: 행사·교육, value: event }
          - { label: 지원사업, value: support }
          - { label: 언론보도, value: press }
      - { name: date, label: 게시일, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: thumbnail, label: 대표 이미지, widget: image, required: false, hint: 목록과 본문 상단에 보입니다. 없으면 분류별 기본 그림이 나옵니다. }
      - { name: body, label: 본문, widget: markdown }
      - { name: attachment, label: 첨부파일, widget: file, required: false, hint: "공고문·신청서 등 (PDF, HWP, 엑셀 등)" }

  # ---------------------------------------------------------
  - name: members
    label: 회원사
    label_singular: 회원사
    description: 회원사 소개 페이지에 보이는 목록입니다. 끌어서 순서를 바꿀 수 있습니다.
    file: content/members.json
    identifier_field: name
    summary: "{{name}} ({{category}})"
    fields:
      - { name: name, label: 회사명, widget: string }
      - name: category
        label: 분야
        widget: select
        options: [화장품, 식품·건강기능식품, 의약·바이오소재, 농축수산·기타]
      - { name: desc, label: 한 줄 소개, widget: string }
      - { name: logo, label: 로고 이미지, widget: image, required: false, hint: 없으면 회사명이 대신 표시됩니다. }
      - { name: url, label: 홈페이지 주소, widget: string, required: false, hint: "https:// 로 시작하는 전체 주소" }

  # ---------------------------------------------------------
  - name: pages
    label: 페이지 내용
    description: 협회 정보와 각 페이지의 문구를 수정합니다.
    files:
      - name: site
        label: 기본 정보 (주소·연락처 등)
        file: content/site.json
        fields:
          - { name: name, label: 법인명, widget: string }
          - { name: nameEn, label: 영문명, widget: string }
          - { name: president, label: 회장 성명, widget: string }
          - { name: founded, label: 설립연도, widget: string }
          - { name: address, label: 주소, widget: string }
          - { name: tel, label: 전화, widget: string }
          - { name: fax, label: 팩스, widget: string, required: false }
          - { name: email, label: 이메일, widget: string, hint: 문의하기 양식이 이 주소로 메일을 보냅니다. }
          - { name: bizNo, label: 고유번호, widget: string, required: false }
          - name: mapEmbedUrl
            label: 지도 주소
            widget: string
            required: false
            hint: 구글 지도 › 공유 › 지도 퍼가기 › HTML 복사 후, src="…" 안의 주소만 붙여 넣으세요.

      - name: home
        label: 메인 화면
        file: content/home.json
        fields:
          - { name: heroTitle, label: 대표 문구, widget: text, hint: 줄을 바꾸면 화면에서도 줄이 바뀝니다. }
          - { name: heroText, label: 소개 문장, widget: text }
          - name: stats
            label: 숫자로 보는 협회
            hint: 회원사 수는 회원사 목록에서 자동으로 계산되어 맨 앞에 표시됩니다.
            widget: list
            summary: "{{label}}: {{value}}"
            fields:
              - { name: value, label: 숫자, widget: string }
              - { name: label, label: 항목, widget: string }
          - name: partners
            label: 협력 기관
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: 기관명, widget: string }
              - { name: url, label: 홈페이지 주소, widget: string, required: false }

      - name: about
        label: 협회소개
        file: content/about.json
        fields:
          - { name: intro, label: 협회개요, widget: text }
          - { name: vision, label: 비전, widget: string }
          - name: goals
            label: 목표
            widget: list
            summary: "{{icon}} {{title}}"
            fields:
              - { name: icon, label: 아이콘(이모지), widget: string, hint: "예: 🤝 🚀 🏛️" }
              - { name: title, label: 제목, widget: string }
              - { name: desc, label: 설명, widget: string }
          - name: history
            label: 연혁
            hint: 최근 연도가 위로 오도록 순서를 맞춰 주세요.
            widget: list
            add_to_top: true
            summary: "{{year}}"
            fields:
              - { name: year, label: 연도, widget: string }
              - { name: items, label: 내용, widget: list, field: { name: item, label: 내용, widget: string } }
          - name: orgUnits
            label: 조직도 (사무국 아래 부서)
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: 부서/분과명, widget: string }
              - { name: note, label: 설명, widget: string, required: false }

      - name: greeting
        label: 회장인사
        file: content/greeting.json
        fields:
          - { name: photo, label: 회장 사진, widget: image, required: false, hint: 세로 사진(3:4 비율)을 권장합니다. }
          - { name: lead, label: 강조 문구, widget: text }
          - { name: body, label: 인사말, widget: markdown, hint: 회장 성명은 '기본 정보'에서 바꾸면 서명에 반영됩니다. }

      - name: business
        label: 주요사업
        file: content/business.json
        fields:
          - name: items
            label: 사업 목록
            widget: list
            summary: "{{icon}} {{title}}"
            fields:
              - { name: icon, label: 아이콘(이모지), widget: string }
              - { name: title, label: 사업명, widget: string }
              - { name: desc, label: 설명, widget: text }

      - name: join
        label: 회원가입 안내
        file: content/join.json
        fields:
          - { name: targets, label: 가입 대상, widget: list, field: { name: item, label: 항목, widget: string } }
          - { name: benefits, label: 회원 혜택, widget: list, field: { name: item, label: 항목, widget: string } }
          - name: steps
            label: 가입 절차
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: 단계명, widget: string }
              - { name: desc, label: 설명, widget: string }
          - { name: entranceFee, label: 입회비, widget: string }
          - { name: annualFee, label: 연회비, widget: string }
          - { name: documents, label: 구비서류, widget: string }
          - { name: applicationFile, label: 가입신청서 파일, widget: file, required: false }
